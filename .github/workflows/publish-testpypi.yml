name: Publish to TestPyPI

on:
  workflow_dispatch:
    # Manual trigger for testing package publication

permissions:
  contents: read
  id-token: write  # Required for TestPyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish-testpypi:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/viscalc
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      
      - name: Build distributions
        run: python -m build
      
      - name: Verify distributions with Twine
        run: python -m twine check dist/*
      
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        # This action uses TestPyPI Trusted Publishing (OIDC)
        # No API token required - authentication via GitHub OIDC
