name: Publish to PyPI

on:
  workflow_dispatch:
    # Manual trigger for intentional production releases
  push:
    tags:
      - 'v*'
    # Trigger on version tags pushed from main branch

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viscalc
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      
      - name: Build distributions
        run: python -m build
      
      - name: Verify distributions with Twine
        run: python -m twine check dist/*
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # This action uses PyPI Trusted Publishing (OIDC)
        # No API token required - authentication via GitHub OIDC
